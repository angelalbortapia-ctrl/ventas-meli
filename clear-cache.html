<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Limpiar caché — Ventas Meli</title>
  <style>
    body { font-family: "SF Pro Text", "Segoe UI", system-ui, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; color: #1a2332; }
    a.btn { display:block; margin-top:12px; padding:14px; border-radius:12px; background:#15202b; color:#fff; text-align:center; text-decoration:none; font-weight:700; }
    #log { margin-top:14px; padding:12px; background:#f4f6f8; border-radius:10px; font-family:ui-monospace,Menlo,monospace; font-size:12px; white-space:pre-wrap; }
  </style>
</head>
<body>
  <h1>Limpiando…</h1>
  <p>Luego instala los datos con el archivo del Mac o la nube.</p>
  <div id="log">Iniciando…</div>
  <a class="btn" id="go" href="./iphone-sync.html">Ir a instalar datos</a>
  <script>
    const log = (m) => { document.getElementById('log').textContent += '\n' + m; };
    (async () => {
      try {
        const regs = await navigator.serviceWorker?.getRegistrations?.() || [];
        for (const r of regs) { await r.unregister(); log('SW off'); }
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
        log('OK');
      } catch (e) { log(String(e && e.message || e)); }
      setTimeout(() => { location.replace('./iphone-sync.html?fresh=' + Date.now()); }, 600);
    })();
  </script>
</body>
</html>
